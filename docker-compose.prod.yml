# PurpleInk 生产编排。
#
# 对应 docs/issues/ISSUE-015-production-issue.md §9 P-7，
# docs/plans/PLAN-001-p2-p6-p7-production-deployment.md §3。
# 接入策略见 docs/deployment/access.md；运行手册见 docs/deployment/runbook.md。
#
# 服务清单（与 PLAN-001 §3.1 一致）：
#   reverse-proxy  唯一 publish（443），Caddy，TLS + IP 过滤 + Basic Auth
#   next           不 publish，制作应用，replicas 固定 1（§3.2：多实例不安全，
#                  stream-bus / status-bus 是进程内 + globalThis 锚定）
#   postgres       不 publish，独立持久卷，强口令
#   migrate        一次性任务，next 依赖它 completed_successfully
#   worker         不 publish，走 BACKEND_ORIGIN 内网被 next 访问

services:
  reverse-proxy:
    build:
      context: ./deploy/reverse-proxy
    ports:
      - "443:443"
    environment:
      CVC_ALLOWED_CIDRS: ${CVC_ALLOWED_CIDRS:-0.0.0.0/0 ::/0}
    secrets:
      - basic_auth_credentials
    volumes:
      - cvc_caddy_data:/data
      - cvc_caddy_config:/config
    depends_on:
      next:
        condition: service_healthy
    restart: unless-stopped

  next:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      # 内网直连 postgres 服务名，口令与 postgres 服务读同一个 POSTGRES_PASSWORD，
      # 避免两处手填导致的凭据漂移。首版不引入 PgBouncer（PLAN-001 §3.4）。
      DATABASE_URL: postgres://cvc:${POSTGRES_PASSWORD:?生产必须设置强口令，不得沿用 dev 的 cvc_dev_only}@postgres:5432/cvc
      CVC_CREDENTIAL_MASTER_KEY: ${CVC_CREDENTIAL_MASTER_KEY}
      CVC_MANAGED_STEPFUN_API_KEY: ${CVC_MANAGED_STEPFUN_API_KEY:?Next 托管 StepFun Key 缺失}
      CVC_MANAGED_MIMO_API_KEY: ${CVC_MANAGED_MIMO_API_KEY:?Next 托管 MiMo Key 缺失}
      CVC_MANAGED_GEMINI_API_KEY: ${CVC_MANAGED_GEMINI_API_KEY:?Next 托管 Gemini Key 缺失}
      CVC_REDEMPTION_CODE_PEPPER: ${CVC_REDEMPTION_CODE_PEPPER:?兑换码 pepper 缺失}
      DATA_DIR: /app/.data
      BACKEND_ORIGIN: http://worker:8787
      # P-4 未落地前的兜底（ISSUE-015 §3.2 / PLAN-001 §3.5）：容器内 CPU 核数
      # 读的是宿主而非 cgroup 限额，必须显式设置，否则会按宿主核数开并发导致
      # OOMKilled。按目标容器的 --cpus 上限调整，不要留空。
      CVC_QUEUE_RENDER_SHOT_CONCURRENCY: ${CVC_QUEUE_RENDER_SHOT_CONCURRENCY:?必须显式设置，见 docs/deployment/runbook.md}
      CVC_QUEUE_DIRECTOR_STAGE_CONCURRENCY: ${CVC_QUEUE_DIRECTOR_STAGE_CONCURRENCY:?必须显式设置，见 docs/deployment/runbook.md}
    volumes:
      - cvc_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-credentials:
        condition: service_completed_successfully
      seed-demo-account:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
    stop_grace_period: 120s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8787"
      STEP_API_KEY: ${STEP_API_KEY}
      STEP_BASE_URL: ${STEP_BASE_URL:-https://api.stepfun.com/v1}
      STEP_MODEL: ${STEP_MODEL:-step-explore}
      STEP_VISION_MODEL: ${STEP_VISION_MODEL:-step-3.7-flash}
      IMAP_HOST: ${IMAP_HOST:-imap.qq.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      SIGNUP_PASSWORD: ${SIGNUP_PASSWORD}
      BROWSER_DRIVER: ${BROWSER_DRIVER:-playwright}
      TTS_PROVIDER: ${TTS_PROVIDER:-listenhub-flowspeech}
      LISTENHUB_API_KEY: ${LISTENHUB_API_KEY}
      LISTENHUB_API_BASE_URL: ${LISTENHUB_API_BASE_URL:-https://api.marswave.ai/openapi}
      LISTENHUB_TTS_ENDPOINT: ${LISTENHUB_TTS_ENDPOINT:-/v1/tts}
      LISTENHUB_TTS_VOICE: ${LISTENHUB_TTS_VOICE:-nanzhongyin-4897116a}
      LISTENHUB_TTS_RESPONSE_FORMAT: ${LISTENHUB_TTS_RESPONSE_FORMAT:-mp3}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_PRIMARY_MODEL: ${GEMINI_PRIMARY_MODEL:-gemini-3.6-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - cvc_worker_out:/repo/server/out
      - cvc_worker_capture:/repo/server/capture
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://cvc:${POSTGRES_PASSWORD:?生产必须设置强口令，不得沿用 dev 的 cvc_dev_only}@postgres:5432/cvc
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Next 侧 AI 凭据是 DB-only（`provider_credentials` 加密表，无 env fallback，
  # 由 config.test.ts:119 / gemini-config.test.ts:93 双向锁定）。运行镜像里没有
  # `src/` 与 `scripts/`，因此凭据注入必须借 `migrate` target 镜像（含 tsx 与源码）
  # 作为一次性任务完成：env 的明文 Key 在这里被真实 API 校验后写入加密存储，
  # 之后运行时只读 DB。这样终端用户不必在设置页填任何 Key。
  #
  # `--allow-empty`：未提供 Key 时如实提示并退出 0，不阻断整栈启动——应用没有
  # 凭据也能正常起，凭据只在跑管线时才需要。Key 校验失败仍退出 1（配置错了必须响）。
  bootstrap-credentials:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    entrypoint: ["pnpm", "tsx", "scripts/setup/bootstrap-credentials.ts", "--allow-empty"]
    environment:
      DATABASE_URL: postgres://cvc:${POSTGRES_PASSWORD:?生产必须设置强口令，不得沿用 dev 的 cvc_dev_only}@postgres:5432/cvc
      CVC_CREDENTIAL_MASTER_KEY: ${CVC_CREDENTIAL_MASTER_KEY:?凭据加密主密钥缺失，见 docs/deployment/runbook.md}
      # 命名隔离是有意的：worker 用 STEP_API_KEY，Next 用 STEPFUN_API_KEY
      # （docs/configuration/credentials.md）。这里默认复用 STEP_API_KEY 的值，
      # 避免运维为同一把 Key 填两遍。
      STEPFUN_API_KEY: ${STEPFUN_API_KEY:-${STEP_API_KEY:-}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      STEPFUN_BASE_URL: ${STEPFUN_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # 路演 / 评审用的公开体验账号。**默认不创建**：未设置 CVC_DEMO_ACCOUNT_EMAIL
  # 与 CVC_DEMO_ACCOUNT_PASSWORD 时脚本原地退出 0，什么也不做。正式对外运营时
  # 不设这两个变量即可，不必改 compose。
  seed-demo-account:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    entrypoint: ["pnpm", "tsx", "scripts/setup/seed-owner-account.ts", "--from-env"]
    environment:
      DATABASE_URL: postgres://cvc:${POSTGRES_PASSWORD:?生产必须设置强口令，不得沿用 dev 的 cvc_dev_only}@postgres:5432/cvc
      CVC_DEMO_ACCOUNT_EMAIL: ${CVC_DEMO_ACCOUNT_EMAIL:-}
      CVC_DEMO_ACCOUNT_PASSWORD: ${CVC_DEMO_ACCOUNT_PASSWORD:-}
      CVC_DEMO_ACCOUNT_NAME: ${CVC_DEMO_ACCOUNT_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: cvc
      POSTGRES_USER: cvc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产必须设置强口令，不得沿用 dev 的 cvc_dev_only}
    volumes:
      - cvc_postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvc -d cvc"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

secrets:
  basic_auth_credentials:
    file: ./deploy/reverse-proxy/secrets/basic_auth_credentials

volumes:
  cvc_data:
  cvc_postgres_prod:
  cvc_caddy_data:
  cvc_caddy_config:
  cvc_worker_out:
  cvc_worker_capture:
