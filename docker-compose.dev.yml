services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: cvc
      POSTGRES_USER: cvc
      POSTGRES_PASSWORD: cvc_dev_only
    ports:
      - "127.0.0.1:54328:5432"
    volumes:
      - cvc_postgres_dev:/var/lib/postgresql/data
      - ./scripts/setup/postgres-init.sql:/docker-entrypoint-initdb.d/001-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvc -d cvc"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  cvc_postgres_dev:
