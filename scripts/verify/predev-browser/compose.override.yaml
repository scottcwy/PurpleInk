# Only used by predev-browser.ts. Names are scoped by its generated project name.
services:
  image-tag-guard:
    image: alpine:3.22
    entrypoint: ["/bin/sh", "-c", "exit 0"]

  postgres:
    ports:
      - "127.0.0.1:${PREDEV_POSTGRES_PORT}:5432"
    volumes:
      - predev_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
      args:
        SOURCE_COMMIT: ${PREDEV_SOURCE_COMMIT}
    image: ${PREDEV_MIGRATE_IMAGE}

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SOURCE_COMMIT: ${PREDEV_SOURCE_COMMIT}
    image: ${PREDEV_WORKER_IMAGE}

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${PREDEV_SOURCE_COMMIT}
    image: ${PREDEV_WEB_IMAGE}
    volumes:
      - predev_data:/app/.data

  caddy:
    ports: !override
      - "127.0.0.1:${PREDEV_HTTP_PORT}:443"
    volumes:
      - ../scripts/verify/predev-browser/Caddyfile.integration:/etc/caddy/Caddyfile:ro
      - predev_caddy_data:/data
      - predev_caddy_config:/config

volumes:
  predev_postgres:
  predev_data:
  predev_caddy_data:
  predev_caddy_config:
