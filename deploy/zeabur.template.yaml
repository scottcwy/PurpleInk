apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: PurpleInk
spec:
  description: PurpleInk Web, render Worker, migrations, and PostgreSQL on Zeabur.
  tags:
    - Video
    - AI
  variables:
    - key: PURPLEINK_DOMAIN
      type: DOMAIN
      name: Domain
      description: Public domain attached to the Web service.
    - key: NEXT_PUBLIC_SITE_URL
      type: STRING
      name: Site URL
      description: Absolute public URL used by application metadata.
  services:
    - name: postgresql
      icon: https://cdn.zeabur.com/marketplace/postgresql.svg
      template: PREBUILT
      spec:
        id: postgresql
        source:
          image: postgres:17.5
        ports:
          - id: database
            port: 5432
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/postgresql/data
        env:
          PGDATA:
            default: /var/lib/postgresql/data
            expose: false
          POSTGRES_CONNECTION_STRING:
            default: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
            expose: true
          POSTGRES_DATABASE:
            default: ${POSTGRES_DB}
            expose: true
          POSTGRES_DB:
            default: purpleink
          POSTGRES_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          POSTGRES_PASSWORD:
            default: ${PASSWORD}
            expose: true
          POSTGRES_PORT:
            default: ${DATABASE_PORT}
            expose: true
          POSTGRES_URI:
            default: ${POSTGRES_CONNECTION_STRING}
            expose: true
          POSTGRES_USER:
            default: purpleink
          POSTGRES_USERNAME:
            default: ${POSTGRES_USER}
            expose: true

    - name: web
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/zeabur/nextjs.svg
      template: GIT
      domainKey: PURPLEINK_DOMAIN
      dependencies:
        - postgresql
        - worker
      spec:
        id: web
        source:
          github:
            repoID: 1309522452
            branch: zeabur/deploy
        ports:
          - id: web
            port: 3000
            type: HTTP
        volumes:
          - id: data
            dir: /app/.data
        env:
          NODE_ENV:
            default: production
            readonly: true
          HOSTNAME:
            default: 0.0.0.0
            readonly: true
          PORT:
            default: "3000"
            readonly: true
          BACKEND_ORIGIN:
            default: http://worker.zeabur.internal:8787
            readonly: true
          DATABASE_URL:
            default: ${POSTGRES_CONNECTION_STRING}
          DATA_DIR:
            default: /app/.data
            readonly: true
          CVC_CREDENTIAL_MASTER_KEY:
            default: ""
          CVC_REDEMPTION_CODE_PEPPER:
            default: ""
          PURPLEINK_ENGINE_INTERNAL_KEY:
            default: ""
          CVC_QUEUE_RENDER_SHOT_CONCURRENCY:
            default: ""
          CVC_QUEUE_DIRECTOR_STAGE_CONCURRENCY:
            default: ""
          AI_PROVIDER_POOL_MODE:
            default: enforce
          AI_SHOT_CONCURRENCY_ENFORCEMENT_PERCENT:
            default: "100"
          CVC_MANAGED_STEPFUN_API_KEY:
            default: ""
          CVC_MANAGED_MIMO_API_KEY:
            default: ""
          CVC_MANAGED_GEMINI_API_KEY:
            default: ""
          CVC_MANAGED_OPENAI_API_KEY:
            default: ""
          CVC_MANAGED_ANTHROPIC_API_KEY:
            default: ""
          CVC_MAIL_SMTP_HOST:
            default: ""
          CVC_MAIL_SMTP_PORT:
            default: ""
          CVC_MAIL_SMTP_USER:
            default: ""
          CVC_MAIL_SMTP_PASS:
            default: ""
          CVC_MAIL_FROM_ADDRESS:
            default: ""
          CVC_MAIL_FROM_NAME:
            default: PurpleInk
          STORAGE_MODE:
            default: s3-mirror
          S3_ENDPOINT:
            default: ""
          S3_BUCKET:
            default: ""
          S3_REGION:
            default: auto
          S3_ACCESS_KEY_ID:
            default: ""
          S3_SECRET_ACCESS_KEY:
            default: ""
          NEXT_PUBLIC_SITE_URL:
            default: ${NEXT_PUBLIC_SITE_URL}

    - name: worker
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/zeabur/nodejs.svg
      template: GIT
      spec:
        id: worker
        source:
          github:
            repoID: 1309522452
            branch: zeabur/deploy
        ports:
          - id: engine
            port: 8787
            type: HTTP
        env:
          NODE_ENV:
            default: production
            readonly: true
          PORT:
            default: "8787"
            readonly: true
          PURPLEINK_AI_GATEWAY_ORIGIN:
            default: http://web.zeabur.internal:3000
            readonly: true
          PURPLEINK_ENGINE_INTERNAL_KEY:
            default: ""
          BROWSER_DRIVER:
            default: playwright
          PURPLEINK_COMPOSE_MODE:
            default: auto
          PURPLEINK_FFMPEG_DIR:
            default: ""

    - name: migrate
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/zeabur/nodejs.svg
      template: GIT
      dependencies:
        - postgresql
      spec:
        id: migrate
        source:
          github:
            repoID: 1309522452
            branch: zeabur/deploy
        env:
          DATABASE_URL:
            default: ${POSTGRES_CONNECTION_STRING}
    - name: backup
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/zeabur/nodejs.svg
      template: GIT
      dependencies:
        - postgresql
      spec:
        id: backup
        source:
          github:
            repoID: 1309522452
            branch: zeabur/deploy
        env:
          DATABASE_URL:
            default: ${POSTGRES_CONNECTION_STRING}
          S3_ENDPOINT:
            default: ""
          S3_BUCKET:
            default: ""
          S3_REGION:
            default: auto
          S3_ACCESS_KEY_ID:
            default: ""
          S3_SECRET_ACCESS_KEY:
            default: ""
          PG_BACKUP_PREFIX:
            default: backups/postgres/
          PG_BACKUP_RETAIN:
            default: "14"
