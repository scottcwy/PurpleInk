name: purpleink

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purpleink}
      POSTGRES_USER: ${POSTGRES_USER:-purpleink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  migrate:
    image: ghcr.io/scottcwy/purpleink-migrate:${IMAGE_TAG:?set IMAGE_TAG}
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      PURPLEINK_DOMAIN: ${PURPLEINK_DOMAIN:?set PURPLEINK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/scottcwy/purpleink-web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      BACKEND_ORIGIN: http://worker:8787
      CVC_CREDENTIAL_MASTER_KEY: ${CVC_CREDENTIAL_MASTER_KEY:?set CVC_CREDENTIAL_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATA_DIR: /app/.data
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      # 产物对象存储：留空即 local（纯本地盘）；s3-mirror 时 S3_* 由 web 进程自行校验必填项。
      STORAGE_MODE: ${STORAGE_MODE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/products/dashboard').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
    volumes:
      - web_data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m

  worker:
    image: ghcr.io/scottcwy/purpleink-worker:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    init: true
    expose:
      - "8787"
    env_file:
      - path: ${WORKER_ENV_FILE:-.env.worker}
        required: true
    environment:
      NODE_ENV: production
      PORT: 8787
    volumes:
      - ./data:/app/server/out
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    mem_limit: 2800m

networks:
  app:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  web_data:
