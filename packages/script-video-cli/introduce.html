ratio:16/10;padding:10px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(140deg,var(--panel-3),var(--panel));display:flex;flex-direction:column;justify-content:space-between}.shot-preview .visual{position:relative;height:65%;overflow:hidden;border-radius:4px;background:linear-gradient(125deg,color-mix(in srgb,var(--signal-2) 18%,transparent),transparent),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 18px)}.shot-preview .visual:after{content:"";position:absolute;left:12%;right:18%;top:42%;height:2px;background:var(--signal);box-shadow:0 8px var(--signal-2),0 -8px var(--purple)}.shot-preview span{font:8px var(--mono);color:var(--faint)}

  <template data-route="overview" data-title="Overview">
    <article class="page">
      <section class="hero-grid">
        <div class="hero-copy">
          <div class="route-kicker">Agent-first / Local-only / Parallel</div>
          <h1>把一篇文稿<br><span class="outline">拆成</span><br>一支<span class="signal">电影。</span></h1>
          <p class="lead">不是再造一个剪辑软件。PurpleInk 把导演、语义分镜、动画代码、浏览器检查、配音与渲染收束为一个本地 CLI，让 AI 同时生产多个镜头，让你随时看见每一步。</p>
          <div class="actions"><a class="button primary" href="#quick-start">生成第一条视频 <span>↗</span></a><a class="button ghost" href="#workflow">进入并行引擎</a></div>
          <div class="proof-line"><span><b>4</b> INPUT TYPES</span><span><b>6×</b> TEXT LANES</span><span><b>1</b> FINAL RENDER</span><span><b>0</b> SAAS DEPENDENCY</span></div>
        </div>
        <div class="console" data-observer-demo>
          <div class="console-head"><div class="window-dots"><i></i><i></i><i></i></div><div class="console-title">PURPLEINK / LIVE RUN</div><div class="live-badge">PROCESSING</div></div>
          <div class="console-body">
            <div class="run-id"><div><h3>AI 不该线性等待。</h3><p>RUN / cinematic-intelligence-001</p></div><div class="run-percent" data-run-percent>64%</div></div>
            <div class="stage-track"><span class="stage-dot done">INGEST</span><span class="stage-dot done">DIRECT</span><span class="stage-dot current">SHOTS</span><span class="stage-dot">RENDER</span><span class="stage-dot">FINAL</span></div>
            <div class="shot-grid">
              <div class="shot-cell done"><div class="shot-top">S001<i></i></div><div class="mini-progress"><i style="--p:100%"></i></div></div>
              <div class="shot-cell done"><div class="shot-top">S002<i></i></div><div class="mini-progress"><i style="--p:100%"></i></div></div>
              <div class="shot-cell"><div class="shot-top">S003<i></i></div><div class="mini-progress"><i style="--p:76%"></i></div></div>
              <div class="shot-cell"><div class="shot-top">S004<i></i></div><div class="mini-progress"><i style="--p:64%"></i></div></div>
              <div class="shot-cell"><div class="shot-top">S005<i></i></div><div class="mini-progress"><i style="--p:81%"></i></div></div>
              <div class="shot-cell"><div class="shot-top">S006<i></i></div><div class="mini-progress"><i style="--p:42%"></i></div></div>
            </div>
          </div>
          <div class="console-foot"><span>127.0.0.1 · ARTIFACTS WHITELISTED</span><button data-action="replay-demo">REPLAY SIGNAL ↻</button></div>
        </div>
      </section>
      <section class="section">
        <div class="section-head"><div><div class="route-kicker">The difference</div><h2>把复杂留给引擎，<br>把控制权还给人。</h2></div><p>输入不是被塞进黑盒。每个镜头都有计划、代码、截图、音频与诊断；任何一步出问题，AI 都能指出绝对路径，只重做坏掉的部分。</p></div>
        <div class="metric-grid">
          <div class="metric-card"><span class="label">Semantic</span><div class="metric-number">1–2<small> 句</small></div><h3>一个完整镜头判断</h3><p>按语义切分，不按字数、标点或固定秒数粗暴硬拆。</p></div>
          <div class="metric-card"><span class="label">Parallel</span><div class="metric-number">N<small> shots</small></div><h3>镜头并发生产</h3><p>代码、Browser QA 与 TTS 分通道并行，最终渲染保持单通道。</p></div>
          <div class="metric-card"><span class="label">Inspectable</span><div class="metric-number">3<small> frames</small></div><h3>每镜头三点快照</h3><p>0%、50%、100% 真实截图，让“有动画”成为可见证据。</p></div>
          <div class="metric-card"><span class="label">Local</span><div class="metric-number">0<small> cloud</small></div><h3>没有 SaaS 业务依赖</h3><p>自己的 API、自己的密钥、自己的文件、自己的机器。</p></div>
        </div>
      </section>
      <section class="section">
        <div class="section-head"><div><div class="route-kicker">Semantic cinema</div><h2>不是切段。<br>是在判断哪里该换镜头。</h2></div><p>语义 INGEST 保留原文事实、限定语、疑问与顺序，形成“一单元、一核心判断、一分镜”的稳定输入。</p></div>
        <div class="split-demo">
          <div class="manuscript"><span class="label">Original manuscript</span><p>传统视频软件把生成过程排成一条队列。<mark>但代码视频真正昂贵的不是时间线，而是每个镜头的理解与表达。</mark> 当镜头可以独立执行，AI 就能并发地思考、编码、检查和配音。</p></div>
          <div class="semantic-output"><span class="label">Semantic units</span><div class="unit-stack">
            <div class="unit"><span class="unit-id">U001</span><span class="unit-copy"><strong>传统路径为什么慢</strong><span>一个核心判断 · 对比镜头</span></span><span class="unit-time">S001</span></div>
            <div class="unit"><span class="unit-id">U002</span><span class="unit-copy"><strong>真正昂贵的是表达决策</strong><span>一个核心判断 · 结构镜头</span></span><span class="unit-time">S002</span></div>
            <div class="unit"><span class="unit-id">U003</span><span class="unit-copy"><strong>独立镜头带来并行生产</strong><span>一个核心判断 · 爆发镜头</span></span><span class="unit-time">S003</span></div>
          </div></div>
        </div>
      </section>
      <div class="callout"><b>DONE ≠ API 200</b><p>真正完成意味着最终 MP4 具有真实 H.264 视频流与 AAC 音频流，分辨率、帧率、时长、SHA-256 和抽帧都通过验收。</p></div>
    </article>
  </template>

        <div class="terminal"><div class="terminal-head"><span data-terminal-title>01 / ENVIRONMENT</span><button class="copy-button" data-copy-target="quick-terminal">COPY</button></div><div class="terminal-screen" id="quick-terminal" data-terminal-screen><span class="comment"># Windows-first prerequisites</span>
<span class="prompt">›</span> node --version      <span class="value">22.11+</span>

<span class="prompt">›</span> ffmpeg -version

<span class="comment"># Docker Desktop 仅批量 daemon 需要</span></div></div>

  <template data-route="commands" data-title="Commands">
    <article class="page">
      <header class="page-header"><div><div class="route-kicker">Command surface</div><h1>少量命令。<br><span class="outline">完整生命周期。</span></h1></div><p class="lead">输入关键词筛选命令。所有自动化优先使用 <code>--json</code>；实时参数永远以 <code>pnpm cli --help</code> 为准。</p></header>

      shot:{index:'02',label:'NEEDS_ATTENTION',title:'找到镜头，不要重跑全片。',body:'先查看对应 S### 的 HTML、三点截图与 diagnostics，确认是布局、动画还是浏览器错误，再只重试该镜头或全部失败镜头。',cmd:'pnpm cli inspect --run <RUN_ID> --shot S004 --json\npnpm cli retry --run <RUN_ID> --shot S004 --json'},
      speech:{index:'03',label:'ASR_NO_SPEECH',title:'系统拒绝伪造文稿。',body:'FFmpeg 没有在规范化音频中检测到有效语音。确认文件不是静音、声道可读，并查看音频处理日志。',cmd:'pnpm cli transcribe .\\speech.wav --json'},
      queue:{index:'04',label:'QUEUE_DATABASE_UNAVAILABLE',title:'只修批量运行环境。',body:'单任务不受影响。启动 Docker Desktop，再重新启动 daemon；停止 daemon 不会删除 PostgreSQL 卷。',cmd:'pnpm cli daemon start --serve --json\npnpm cli daemon status --json'},
      media:{index:'05',label:'MEDIA_QA_FAILED',title:'检查真正的最终媒体。',body:'查看 HyperFrames 与 FFmpeg 日志。最终文件必须具有 H.264 视频流；旁白开启时还必须存在 AAC 音轨。',cmd:'pnpm cli inspect --run <RUN_ID> --json\nffprobe <ABSOLUTE_VIDEO_PATH>'},
      observer:{index:'06',label:'OBSERVER_START_FAILED',title:'重新获取实际临时端口。',body:'port 0 每次由系统重新分配。确认 serve 或 daemon 进程仍在运行，并以最新 JSON 返回的 url/observerUrl 为准。',cmd:'pnpm cli serve --run <RUN_ID> --port 0 --json\npnpm cli daemon status --json'}
    };
    const artifacts={
      script:{graphic:'U001 → S001',kind:'application/json',status:'NORMALIZED',hash:'1a72…0f4c',path:'C:\\PurpleInk\\runs\\cinematic-intelligence-001\\input\\semantic-script.json'},
      prompt:{graphic:'VISUAL\nCONSTITUTION',kind:'text/plain',status:'INJECTED × N',hash:'c447…82e1',path:'C:\\PurpleInk\\runs\\cinematic-intelligence-001\\input\\global-prompt.txt'},
      html:{graphic:'SEEK-SAFE\nHTML',kind:'text/html',status:'BROWSER QA',hash:'829f…11ac',path:'C:\\PurpleInk\\runs\\cinematic-intelligence-001\\shots\\S001\\attempt-001\\source.html'},
      frame:{graphic:'每一秒\n都在表达',kind:'image/png',status:'REGISTERED',hash:'7dd5…b91a',path:'C:\\PurpleInk\\runs\\cinematic-intelligence-001\\shots\\S001\\attempt-001\\screenshots\\050.png'},
      audio:{graphic:'VOICE / 08.4s',kind:'audio/wav',status:'DURATION LOCKED',hash:'33ac…d92e',path:'C:\\PurpleInk\\runs\\cinematic-intelligence-001\\shots\\S001\\narration.wav'},
      video:{graphic:'FINAL\nMP4 ▶',kind:'video/mp4',status:'H.264 + AAC',hash:'f02e…774d',path:'C:\\PurpleInk\\runs\\cinematic-intelligence-001\\final\\video.mp4'},
      index:{graphic:'110\nARTIFACTS',kind:'application/json',status:'WHITELIST',hash:'99e4…a021',path:'C:\\PurpleInk\\runs\\cinematic-intelligence-001\\artifacts\\index.json'}
    };
    function clearPageTimers(){pageTimers.forEach(clearInterval);pageTimers=[]}
    function render(){
      clearPageTimers();
      const requested=location.hash.slice(1)||'overview';
      const route=routes.has(requested)?requested:'overview';
      app.replaceChildren(routes.get(route).content.cloneNode(true));
      document.querySelectorAll('#nav a').forEach(link=>link.classList.toggle('active',link.dataset.route===route));
      document.getElementById('route-name').textContent=routes.get(route).dataset.title;
      document.title=`PurpleInk Local CLI · ${routes.get(route).dataset.title}`;
      document.body.classList.remove('menu-open');
      scrollTo({top:0,behavior:'instant'});
      initRoute(route);
    }
    function initRoute(route){
      bindCopyButtons();
      if(route==='overview') startDemo();
      if(route==='quick-start') initQuickStart();
      if(route==='commands') initCommandSearch();
      if(route==='workflow') initPipeline();
      if(route==='observer') startObserverPulse();
      if(route==='artifacts') initArtifacts();
      if(route==='troubleshooting') initDiagnosis();
      if(route==='agent-usage') initPromptComposer();
    }
    function startDemo(){
      const percent=app.querySelector('[data-run-percent]');
      const bars=[...app.querySelectorAll('.shot-cell .mini-progress i')];
      let value=42;
      const tick=()=>{value=value>=94?42:value+7;percent.textContent=`${value}%`;bars.forEach((bar,index)=>bar.style.setProperty('--p',`${Math.min(100,value+index*8-16)}%`))};
      pageTimers.push(setInterval(tick,1300));
      app.querySelector('[data-action="replay-demo"]')?.addEventListener('click',()=>{value=35;tick()});
    }
    function initQuickStart(){
      const screen=app.querySelector('[data-terminal-screen]');
      const title=app.querySelector('[data-terminal-title]');
      app.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>{
        app.querySelectorAll('[data-step]').forEach(item=>item.classList.remove('active'));
        button.classList.add('active');
        const step=terminalSteps[Number(button.dataset.step)];title.textContent=step.title;screen.innerHTML=step.html;
      }));
    }
    function initCommandSearch(){
      const input=app.querySelector('#command-search');const cards=[...app.querySelectorAll('.command-card')];const count=app.querySelector('#command-count');
      input.addEventListener('input',()=>{const query=input.value.trim().toLowerCase();let visible=0;cards.forEach(card=>{const hit=!query||`${card.dataset.keywords} ${card.textContent}`.toLowerCase().includes(query);card.classList.toggle('hidden',!hit);if(hit)visible++});count.textContent=`${visible} COMMANDS`});
    }
    function initPipeline(){
      const detail=app.querySelector('#pipeline-detail');app.querySelectorAll('[data-pipeline]').forEach(button=>button.addEventListener('click',()=>{app.querySelectorAll('[data-pipeline]').forEach(node=>node.classList.remove('active'));button.classList.add('active');const data=pipelineData[button.dataset.pipeline];detail.innerHTML=`<div class="big-index">${data.index}</div><span class="label">${data.label}</span><h2>${data.title}</h2><p>${data.body}</p><div class="detail-proof">${data.proof}</div>`}));
    }
    function startObserverPulse(){
      const percent=app.querySelector('[data-observer-percent]');const timeline=app.querySelector('[data-live-timeline]');let value=64;
      pageTimers.push(setInterval(()=>{value=Math.min(92,value+3);percent.textContent=`${value}%`;if(value>=76){const items=timeline.children;items[2].className='timeline-item done';items[2].lastElementChild.textContent='DONE #1';items[3].className='timeline-item running';items[3].lastElementChild.textContent='RUNNING'}if(value>=92)value=64},1500));
    }
    function initArtifacts(){
      const graphic=app.querySelector('#artifact-graphic'),kind=app.querySelector('#artifact-kind'),status=app.querySelector('#artifact-status'),hash=app.querySelector('#artifact-hash'),path=app.querySelector('#artifact-path');
      app.querySelectorAll('[data-artifact]').forEach(button=>button.addEventListener('click',()=>{app.querySelectorAll('[data-artifact]').forEach(item=>item.classList.remove('active'));button.classList.add('active');const data=artifacts[button.dataset.artifact];graphic.innerText=data.graphic;kind.textContent=data.kind;status.textContent=data.status;hash.textContent=data.hash;path.textContent=data.path}));
    }
    function initDiagnosis(){
      const panel=app.querySelector('#diagnosis');app.querySelectorAll('[data-symptom]').forEach(button=>button.addEventListener('click',()=>{app.querySelectorAll('[data-symptom]').forEach(item=>item.classList.remove('active'));button.classList.add('active');const data=diagnoses[button.dataset.symptom];panel.innerHTML=`<div class="diagnosis-index">${data.index}</div><div><span class="label">${data.label}</span><h2>${data.title}</h2><p>${data.body}</p><pre>${escapeHtml(data.cmd)}</pre></div>`}));
    }
    function initPromptComposer(){
      const palette=app.querySelector('#palette-choice'),dimension=app.querySelector('#dimension-choice'),style=app.querySelector('#style-choice'),input=app.querySelector('#input-choice'),output=app.querySelector('[data-prompt-content]');
      const update=()=>{output.textContent=`请使用 generating-purpleink-script-videos Skill，把下面文件生成一条真实的带旁白文稿视频：\n\n输入文件：${input.value}\n\n全局视觉硬约束：\n- 色系：${palette.value}\n- 空间：${dimension.value}\n- 风格：${style.value}\n\n开始前不要立即运行。先结合当前对话，用一个紧凑问题补齐仍缺失的视觉选择。如果还有其他视觉 Skill，只提炼它的配色、排版、构图、材质、镜头、运动、特效和视觉禁忌。\n\n把确认结果写入 UTF-8 global Prompt，并通过 --global-prompt-file 注入 DIRECT、每个 SHOT-SPEC、每个 FABRICATE 和 HTML repair。默认先启动 pnpm cli serve --port 0 --json 并返回 observer URL，再执行真实 Provider 工作流。\n\n若镜头失败，先返回对应 HTML、三点截图、音频和诊断的绝对路径，只重试失败镜头。只有 inspect 返回最终 MP4 路径，且 H.264、AAC、分辨率、帧率、时长和抽帧验收通过后，才报告完成。`};
      [palette,dimension,style,input].forEach(control=>control.addEventListener('input',update));update();
    }
    function bindCopyButtons(){app.querySelectorAll('[data-copy-target]').forEach(button=>button.addEventListener('click',()=>{const target=document.getElementById(button.dataset.copyTarget);copyText(target?.innerText||target?.textContent||'')}))}
    async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}toast.classList.add('show');clearTimeout(copyText.timer);copyText.timer=setTimeout(()=>toast.classList.remove('show'),1600)}
    function escapeHtml(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function setTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem('purpleink-intro-theme',theme)}catch{}}
    document.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(action==='theme')setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(action==='open-menu')document.body.classList.add('menu-open');if(action==='close-menu')document.body.classList.remove('menu-open')});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')document.body.classList.remove('menu-open');if(event.key==='t'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(event.key==='/'&&location.hash==='#commands'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){event.preventDefault();document.getElementById('command-search')?.focus()}});
    document.addEventListener('pointermove',event=>{document.documentElement.style.setProperty('--mx',`${event.clientX/window.innerWidth*100}%`);document.documentElement.style.setProperty('--my',`${event.clientY/window.innerHeight*100}%`)});
    try{setTheme(localStorage.getItem('purpleink-intro-theme')||'dark')}catch{}
    addEventListener('hashchange',render);render();
  </script>
</body>
