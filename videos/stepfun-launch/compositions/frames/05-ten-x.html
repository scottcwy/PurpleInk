  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="05-ten-x"]');
      const tl = gsap.timeline({ paused: true });

      const handoff = root.querySelector('[id="05-ten-x-handoff"]');
      const crystal = root.querySelector('[id="05-ten-x-crystal"]');
      const cloudStage = root.querySelector('[id="05-ten-x-cloud-stage"]');
      const brick = root.querySelector('[id="05-ten-x-brick"]');
      const brickName = root.querySelector('[id="05-ten-x-brick-name"]');
      const logo = root.querySelector('[id="05-ten-x-logo"]');
      const mission = root.querySelector('[id="05-ten-x-mission"]');
      const missionBody = root.querySelector('[id="05-ten-x-mission-body"]');
      const missionFill = root.querySelector('[id="05-ten-x-mission-fill"]');
      const ringField = root.querySelector('[id="05-ten-x-ring-field"]');
      const urlPill = root.querySelector('[id="05-ten-x-url-pill"]');
      const urlLine = root.querySelector('[id="05-ten-x-url-line"]');
      const cta = root.querySelector('[id="05-ten-x-cta"]');
      const fragments = Array.from(root.querySelectorAll('[class~="05-ten-x-frag"]'));

      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const radius = 410;
      const zNear = 260;
      const zFar = -300;
      const tumble = 68;

      const scatter = fragments.map((element, index) => {
        const angle = index * goldenAngle;
        const depthT = fragments.length > 1 ? index / (fragments.length - 1) : 0;
        return {
          x: Math.cos(angle) * radius,
          y: Math.sin(angle) * radius,
          z: zNear - depthT * (zNear - zFar),
          rotationX: Math.sin(angle) * tumble,
          rotationY: Math.cos(angle) * tumble,
        };
      });

      fragments.forEach((element, index) => {
        gsap.set(element, {
          xPercent: -50,
          yPercent: -50,
          ...scatter[index],
          opacity: 0,
        });
      });

      gsap.set(brick, { scale: 0.9, opacity: 0 });
      gsap.set(brickName, { scale: 0.9, opacity: 0 });
      gsap.set(missionFill, { scaleX: 0 });

      tl.fromTo(
        crystal,
        { scale: 0.08, y: 24, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.66, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        handoff,
        { y: -12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        0.04,
      );
      tl.fromTo(
        ringField,
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 1.3, ease: "power2.out" },
        0.22,
      );

      tl.to(
        crystal,
        { scale: 0.88, opacity: 0.7, duration: 1.25, ease: "power2.out" },
        1.65,
      );
      tl.to(
        cloudStage,
        { rotationY: 26, duration: 1.28, ease: "power1.out" },
        1.65,
      );

      fragments.forEach((element, index) => {
        tl.to(
          element,
          {
            x: Number(element.dataset.targetX),
            y: Number(element.dataset.targetY),
            z: 0,
            rotationX: 0,
            rotationY: 0,
            opacity: 1,
            duration: 1.02,
            ease: "power3.out",
          },
          1.65 + index * 0.055,
        );
      });

      tl.to(
        brick,
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.7,
      );
      tl.fromTo(
        brickName,
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.24, ease: "power3.out" },
        2.94,
      );
      tl.to(
        cloudStage,
        { rotationY: 0, duration: 0.25, ease: "power2.out" },
        2.9,
      );

      tl.to(
        cloudStage,
        { scale: 0.88, y: -18, opacity: 0.16, duration: 0.72, ease: "power2.out" },
        3.15,
      );
      tl.to(
        brick,
        { scale: 0.86, y: -18, opacity: 0.22, duration: 0.72, ease: "power2.out" },
        3.15,
      );
      tl.to(
        crystal,
        { scale: 0.72, y: -18, opacity: 0.18, duration: 0.72, ease: "power2.out" },
        3.15,
      );
      tl.to(
        handoff,
        { scale: 0.74, y: -18, opacity: 0.5, duration: 0.65, ease: "power2.out" },
        3.15,
      );
      tl.fromTo(
        logo,
        { scale: 0.64, y: 18, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        3.15,
      );
      tl.fromTo(
        mission,
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        3.42,
      );

      const missionContent = [
        { key: "step", body: "智能阶跃", hold: 0.08 },
        { key: "ten", body: "智能阶跃 · 十倍", hold: 0.1 },
        { key: "possibility", body: "智能阶跃 · 十倍每个人的可能", hold: 0.22 },
      ];
      const baseDuration = 0.08;
      const secondsPerCharacter = 0.01;
      let cumulative = 0;
      const missionTimeline = missionContent.map((entry) => {
        const duration = baseDuration + entry.body.length * secondsPerCharacter + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });

      const missionAt = (time) => {
        for (let index = missionTimeline.length - 1; index >= 0; index -= 1) {
          if (time >= missionTimeline[index].start) return missionTimeline[index];
        }
        return missionTimeline[0];
      };

      const missionDriver = { time: 0 };
      let lastMissionKey = "";
      tl.to(
        missionDriver,
        {
          time: cumulative,
          duration: 1.36,
          ease: "none",
          onUpdate: () => {
            const entry = missionAt(missionDriver.time);
            if (entry.key !== lastMissionKey) {
              missionBody.textContent = entry.body;
              lastMissionKey = entry.key;
            }
            const progress = cumulative ? missionDriver.time / cumulative : 1;
            missionFill.style.transform = `scaleX(${progress})`;
          },
        },
        3.58,
      );

      tl.fromTo(
        urlPill,
        { xPercent: -105, opacity: 0 },
        { xPercent: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        5.05,
      );
      tl.fromTo(
        urlLine,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
        5.08,
      );
      tl.fromTo(
        cta,
        { xPercent: -105, opacity: 0 },
        { xPercent: 0, opacity: 1, duration: 0.34, ease: "power3.out" },
        5.14,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["05-ten-x"] = tl;
    })();
  </script>
