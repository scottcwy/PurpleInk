  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "02-one-call";
      const root = document.querySelector('[data-composition-id="02-one-call"]');
      const code = document.getElementById("02-one-call-code");
      const stage = document.getElementById("02-one-call-stage");
      const centerDisc = document.getElementById("02-one-call-center-disc");
      const lockup = document.getElementById("02-one-call-logo-lockup");
      const promise = document.getElementById("02-one-call-promise");
      const progressFill = document.getElementById("02-one-call-progress-fill");
      const modules = Array.from(root.querySelectorAll('[class~="02-one-call-module"]'));
      const platform = root.querySelector('[class~="02-one-call-platform"]');
      const studio = root.querySelector('[class~="02-one-call-studio"]');
      const capabilityTags = Array.from(root.querySelectorAll('[class~="02-one-call-capability"]'));

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;

      const GOLDEN = Math.PI * (3 - Math.sqrt(5));
      const cloud = modules.map((element, index) => {
        const angle = index * GOLDEN;
        const depthProgress = modules.length > 1 ? index / (modules.length - 1) : 0;
        return {
          x: Math.cos(angle) * 205,
          y: Math.sin(angle) * 132,
          z: 220 - depthProgress * 440,
          rotationX: Math.sin(angle) * 68,
          rotationY: Math.cos(angle) * 68,
        };
      });

      modules.forEach((element, index) => {
        gsap.set(element, {
          xPercent: -50,
          yPercent: -50,
          ...cloud[index],
          opacity: 0,
          transformPerspective: 1500,
        });
      });
      gsap.set(lockup, { opacity: 0, scale: 0.72 });
      gsap.set(promise, { opacity: 0, y: 14 });
      gsap.set(progressFill, { scaleX: 0 });

      tl.fromTo(
        centerDisc,
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
        0.02,
      );
      tl.fromTo(
        platform,
        { xPercent: -50, yPercent: -50, x: 0, y: 16, z: 0, scale: 0, opacity: 0 },
        { xPercent: -50, yPercent: -50, x: 0, y: 0, z: 0, scale: 0.94, opacity: 1, duration: 0.66, ease: "power3.out" },
        0.04,
      );
      tl.fromTo(
        code,
        { scale: 0, y: 10, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        0.08,
      );

      tl.to(code, { y: -10, opacity: 0.72, duration: 0.7, ease: "power2.out" }, 1.15);
      tl.to(centerDisc, { scale: 0.62, opacity: 0.38, duration: 1.05, ease: "power3.out" }, 1.15);

      tl.to(
        platform,
        {
          x: Number(platform.dataset.targetX),
          y: Number(platform.dataset.targetY),
          z: Number(platform.dataset.targetZ),
          scale: 0.96,
          rotationX: -4,
          rotationY: 8,
          opacity: 1,
          duration: 1.22,
          ease: "power3.out",
        },
        1.15,
      );
      tl.fromTo(
        studio,
        { xPercent: -50, yPercent: -50, x: 0, y: 0, z: 0, scale: 0.6, opacity: 0 },
        {
          xPercent: -50,
          yPercent: -50,
          x: Number(studio.dataset.targetX),
          y: Number(studio.dataset.targetY),
          z: Number(studio.dataset.targetZ),
          scale: 1,
          rotationX: 5,
          rotationY: -7,
          opacity: 1,
          duration: 1.26,
          ease: "power3.out",
        },
        1.2,
      );

      capabilityTags.forEach((element, index) => {
        tl.fromTo(
          element,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, z: 0, scale: 0.6, opacity: 0 },
          {
            xPercent: -50,
            yPercent: -50,
            x: Number(element.dataset.targetX),
            y: Number(element.dataset.targetY),
            z: Number(element.dataset.targetZ),
            scale: 1,
            opacity: 1,
            duration: 1.12,
            ease: "power3.out",
          },
          1.25 + index * 0.14,
        );
      });

      modules.forEach((element, index) => {
        const point = cloud[index];
        tl.to(
          element,
          {
            x: point.x,
            y: point.y,
            z: point.z,
            rotationX: point.rotationX,
            rotationY: point.rotationY,
            scale: element === platform ? 0.72 : element === studio ? 0.78 : 0.88,
            opacity: 0.76,
            duration: 0.38,
            ease: "power1.inOut",
          },
          2.75 + index * 0.025,
        );
        tl.to(
          element,
          {
            x: 0,
            y: 0,
            z: 0,
            rotationX: 0,
            rotationY: 0,
            scale: element === platform ? 0.28 : element === studio ? 0.32 : 0.5,
            opacity: 0.1,
            duration: 0.84,
            ease: "power3.out",
          },
          3.05 + index * 0.045,
        );
      });
      tl.to(stage, { rotationY: 24, duration: 0.46, ease: "power1.out" }, 2.75);
      tl.to(stage, { rotationY: 0, duration: 0.72, ease: "power3.out" }, 3.16);
      tl.to(centerDisc, { scale: 0.42, opacity: 0.22, duration: 0.86, ease: "power3.out" }, 2.96);
      tl.to(code, { y: -14, opacity: 0.16, duration: 0.68, ease: "power2.out" }, 3.02);

      tl.fromTo(
        lockup,
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.86, ease: "power3.out" },
        3.18,
      );

      const PROMISE_CONTENT = [
        { key: "first", text: "真正", hold: 0.14 },
        { key: "second", text: "真正工作的", hold: 0.12 },
        { key: "final", text: "真正工作的 Agent", hold: 0.24 },
      ];
      const BASE_DURATION = 0.08;
      const SEC_PER_CHAR = 0.018;
      let cumulative = 0;
      const PROMISE_TIMELINE = PROMISE_CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.text.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const promiseEntryAt = (time) => {
        for (let index = PROMISE_TIMELINE.length - 1; index >= 0; index -= 1) {
          if (time >= PROMISE_TIMELINE[index].start) return PROMISE_TIMELINE[index];
        }
        return PROMISE_TIMELINE[0];
      };
      const promiseDriver = { time: 0 };
      let lastPromiseKey = "";

      tl.fromTo(
        promise,
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
        4.18,
      );
      tl.to(
        promiseDriver,
        {
          time: cumulative,
          duration: 0.58,
          ease: "none",
          onUpdate: () => {
            const entry = promiseEntryAt(promiseDriver.time);
            if (entry.key !== lastPromiseKey) {
              promise.textContent = entry.text;
              lastPromiseKey = entry.key;
            }
          },
        },
        4.2,
      );

      tl.fromTo(progressFill, { scaleX: 0 }, { scaleX: 1, duration: 5, ease: "none" }, 0);
    })();
  </script>
